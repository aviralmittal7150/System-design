<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Ticket Booking System - UML Architecture Diagram</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f8fafc;
        }
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
        }
        .header p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: #94a3b8;
        }
        .container {
            width: 95vw;
            max-width: 1800px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            padding: 10px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cinema Ticket Booking System</h1>
        <p>B.Tech CSE Semester 5 | UML Class Diagram &amp; System Architecture Poster</p>
    </div>
    
    <div class="container">
        <object type="image/svg+xml" data="architecture_class_diagram.svg" style="width: 100%; height: auto;"></object>
    </div>

    <div class="actions">
        <button onclick="window.print()">🖨️ Print / Save as PDF</button>
    </div>
</body>
</html>
